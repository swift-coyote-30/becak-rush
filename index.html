<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becak Rush - Kampoeng Delivery</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0f141b; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position:relative; width:min(100vw, 177.78vh); height:min(100vh, 56.25vw); background:#111; }
  canvas { display:block; width:100%; height:100%; image-rendering:auto; }
  #hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#ffffffaa; font-size:12px; pointer-events:none; letter-spacing:.04em; }
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000} html,body{margin:0;padding:0;height:100dvh;overflow:hidden;background:#000} canvas{width:100vw!important;height:100dvh!important;display:block;touch-action:none}

/* JEMPOL GEDE EDITION - tombol arah digedein + direnggangin */
button, .btn, .dpad button, .controls button, [class*="dpad"] button, [class*="btn"]{
  min-width:72px !important;
  min-height:72px !important;
  width:72px !important;
  height:72px !important;
  font-size:30px !important;
  border-radius:50% !important;
}
.dpad, .controls, [class*="dpad"], [class*="controls"]{
  gap:14px !important;
  bottom:28px !important;
  left:16px !important;
  padding:10px !important;
}
/* tombol atas-bawah-kiri-kanan jangan nempel */
.dpad button + button, .controls button + button{
  margin:7px !important;
}
/* tombol gas / kuning di kanan juga digedein dikit */
button:last-child{
  min-width:76px !important;
  min-height:76px !important;
}

</style>
</head>
<body>
<button id="btnFS" style="position:fixed;top:8px;right:8px;z-index:999;font-size:22px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:10px;padding:6px 10px">⛶</button>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Keyboard: Panah / WASD &bull; Spasi: Klakson / Ambil &bull; Mouse: Klik tombol &bull; P: Pause &bull; M: Suara</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
canvas{width:100vw;height:100vh;display:block}
